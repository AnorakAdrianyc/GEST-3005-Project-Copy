[project]
name = "dartboard-cs"
version = "0.1.0"
description = "FSR serial bridge + Muse OSC scaffold for dual-task session join (fixture-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
  "python-osc>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dartboard-cs = "cs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cs*"]
